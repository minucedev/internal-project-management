spring.application.name=crm_mini
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/crm_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=y4ApmWGlScTuI4Srk6h/KJwUOVZbU7duGzzIdMvLOGE=
# Access token expiration: 15 minutes (in milliseconds)
jwt.expiration=900000
# Refresh token expiration: 7 days (in milliseconds)
jwt.refresh-expiration=604800000

# Swagger/OpenAPI Configuration 
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging Configuration
logging.level.com.internalpj.crm_mini.security.jwt=DEBUG
logging.level.org.springframework.security=DEBUG

# Email Configuration (Gmail SMTP)
app.mail.from=${EMAIL_USERNAME}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend URL for invitation links
app.frontend.url=http://localhost:3000
